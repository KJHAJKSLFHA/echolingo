  <!-- 底部回音点 -->
  <circle cx="360" cy="720" r="20" fill="#ffffff" opacity="0.85"/>
  <circle cx="430" cy="720" r="20" fill="#ffffff" opacity="0.55"/>
  <circle cx="500" cy="720" r="20" fill="#ffffff" opacity="0.3"/>
